<div class="ssu-spa-loader" role="status" aria-live="polite" aria-label="Loading DATABASY">
  <style>
    .ssu-spa-loader {
      position: fixed;
      z-index: 11000;
      inset: 0;
      display: flex;
      min-height: 100vh;
      min-height: 100svh;
      flex-direction: column;
      overflow: hidden;
      background: #fcfcfc;
      color: #1a1a1a;
      font-family: 'Space Grotesk', Inter, Arial, sans-serif;
    }

    .ssu-spa-loader__header,
    .ssu-spa-loader__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-inline: clamp(1.25rem, 4vw, 4.5rem);
    }

    .ssu-spa-loader__header {
      min-height: 5rem;
      border-bottom: 1px solid #e9e9e7;
    }

    .ssu-spa-loader__brand {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .ssu-spa-loader__status {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      color: #626262;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .ssu-spa-loader__status-dot {
      width: 0.42rem;
      height: 0.42rem;
      border-radius: 50%;
      background: #285095;
      animation: ssu-spa-pulse 900ms ease-in-out infinite alternate;
    }

    .ssu-spa-loader__body {
      display: flex;
      width: min(calc(100% - 2.5rem), 78rem);
      flex: 1;
      flex-direction: column;
      justify-content: center;
      margin-inline: auto;
      padding-block: 3rem;
    }

    .ssu-spa-loader__statement {
      margin: 0;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(3rem, 7.5vw, 6rem);
      font-weight: 600;
      line-height: 1.04;
      letter-spacing: -0.04em;
    }

    .ssu-spa-loader__statement span { color: #676767; }

    .ssu-spa-loader__progress {
      position: relative;
      width: min(100%, 32rem);
      height: 1px;
      margin-top: clamp(2rem, 5vw, 4rem);
      overflow: hidden;
      background: #cfcfca;
    }

    .ssu-spa-loader__progress span {
      position: absolute;
      inset: 0;
      background: #1a1a1a;
      transform: scaleX(0);
      transform-origin: left;
      animation: ssu-spa-progress 1.15s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    .ssu-spa-loader__footer {
      min-height: 4.5rem;
      border-top: 1px solid #e9e9e7;
      color: #626262;
      font-size: 0.72rem;
      font-weight: 600;
    }

    @keyframes ssu-spa-progress {
      0% { transform: scaleX(0); transform-origin: left; }
      48% { transform: scaleX(1); transform-origin: left; }
      52% { transform: scaleX(1); transform-origin: right; }
      100% { transform: scaleX(0); transform-origin: right; }
    }

    @keyframes ssu-spa-pulse {
      from { opacity: 0.35; transform: scale(0.78); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 560px) {
      .ssu-spa-loader__header { min-height: 4.5rem; }
      .ssu-spa-loader__body { padding-block: 2.5rem; }
      .ssu-spa-loader__statement { font-size: clamp(2.8rem, 14vw, 4.25rem); }
      .ssu-spa-loader__footer { align-items: flex-start; flex-direction: column; justify-content: center; gap: 0.2rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ssu-spa-loader *,
      .ssu-spa-loader *::before,
      .ssu-spa-loader *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }

      .ssu-spa-loader__progress span { transform: scaleX(0.72); }
    }
  </style>

  <header class="ssu-spa-loader__header">
    <span class="ssu-spa-loader__brand">DATABASY</span>
    <span class="ssu-spa-loader__status">
      <span class="ssu-spa-loader__status-dot" aria-hidden="true"></span>
      Preparing your view
    </span>
  </header>

  <div class="ssu-spa-loader__body">
    <p class="ssu-spa-loader__statement">
      Everything you need,<br>
      <span>coming into view.</span>
    </p>

    <div class="ssu-spa-loader__progress" aria-hidden="true"><span></span></div>
  </div>

  <footer class="ssu-spa-loader__footer">
    <span>Storefronts that feel like yours.</span>
    <span>One place to run them.</span>
  </footer>
</div>
